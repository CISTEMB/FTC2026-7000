name: Generate rustdoc and publish it

on:
  push:
    branches:
    - main


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  document:
    name: generate documentation and publish it
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: rustup toolchain install
      uses: dtolnay/rust-toolchain@v1
      with:
        # Rust toolchain specification -- see https://rust-lang.github.io/rustup/concepts/toolchains.html#toolchain-specification
        toolchain: stable
        # Comma-separated list of components to be additionally installed
        components: rustc, cargo
    - name: generate documentation
      run: |
        cargo doc
    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        # Generated documentation
        path: 'target/doc'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
    
